name: RSS Discord Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行も可能にする

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore seen articles cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: /tmp/seen_articles.json
          key: seen-articles-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seen-articles-

      - name: Run RSS Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEEN_ARTICLES_PATH: /tmp/seen_articles.json
        run: |
          python rss_discord_bot.py --once

      - name: Save seen articles cache
        uses: actions/cache/save@v4
        if: always() # エラーが起きても既読情報を極力保存するために常に実行
        with:
          path: /tmp/seen_articles.json
          key: seen-articles-${{ github.run_id }}-${{ github.run_attempt }}
